<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Weems</title>
    <link rel="stylesheet" href="window.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo" aria-hidden="true">W</div>
      <div class="head-text">
        <h1>Weems en local</h1>
        <p id="summary"><span class="dot"></span><span id="summary-text">Lecture…</span></p>
      </div>
      <div class="head-buttons" id="head-buttons"></div>
    </header>
    <p class="notice" id="notice" hidden></p>
    <div class="middle">
      <section class="list" id="rows" aria-label="Services"></section>
      <aside class="stats" aria-label="Le site en ce moment">
        <h2>Le site en ce moment</h2>
        <div class="stat live">
          <span class="stat-value" id="stat-live">—</span>
          <span class="stat-label">En vol maintenant</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-pilots">—</span>
          <span class="stat-label">Pilotes</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="stat-flights">—</span>
          <span class="stat-label">Vols enregistrés</span>
        </div>
        <p class="muted" id="stats-note">L'API ne répond pas.</p>
      </aside>
    </div>
    <nav class="links">
      <button class="button small open" data-open="site">Ouvrir le site</button>
      <button class="button small open" data-open="console">Ouvrir la console</button>
      <button class="button small simulate" data-open="traffic">Simuler du trafic</button>
      <button class="button small simulate" data-open="activity">Simuler des activités</button>
      <button class="button small brand docker" data-open="docker" data-icon="docker">
        Docker
      </button>
      <button class="button small brand vscode" data-open="vscode" data-icon="code">VS Code</button>
    </nav>
    <section class="logs" aria-label="Journaux">
      <div class="logs-head">
        <strong>Journaux</strong>
        <div class="tabs" id="tabs">
          <button data-tab="db">Base</button>
          <button data-tab="api">API</button>
          <button data-tab="site">Site</button>
          <button data-tab="console">Console</button>
        </div>
        <span class="muted" id="logs-count"></span>
      </div>
      <pre id="logs"></pre>
    </section>
    <script src="view.js"></script>
  </body>
</html>
