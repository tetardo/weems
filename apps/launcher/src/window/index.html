<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Weems</title>
    <link rel="stylesheet" href="window.css" />
  </head>
  <body>
    <header class="head">
      <div class="logo" aria-hidden="true">W</div>
      <div class="head-text">
        <h1>Weems en local</h1>
        <p id="summary"><span class="dot"></span><span id="summary-text">Lecture…</span></p>
      </div>
      <div class="head-buttons">
        <button
          class="button brand docker icon-only"
          data-open="docker"
          data-icon="docker"
          title="Ouvrir Docker Desktop"
          aria-label="Ouvrir Docker Desktop"
        ></button>
        <button
          class="button brand vscode icon-only"
          data-open="vscode"
          data-icon="code"
          title="Ouvrir le projet dans VS Code"
          aria-label="Ouvrir le projet dans VS Code"
        ></button>
        <div class="menu">
          <button class="button open menu-toggle" data-icon="globe" aria-haspopup="menu">
            Ouvrir<span class="chevron" data-icon="chevron"></span>
          </button>
          <div class="menu-list" role="menu">
            <button role="menuitem" data-open="site">Le site web</button>
            <button role="menuitem" data-open="console">La console d'administration</button>
          </div>
        </div>
        <div class="menu">
          <button
            class="button primary menu-toggle"
            id="power-toggle"
            data-icon="power"
            aria-haspopup="menu"
          >
            Services<span class="chevron" data-icon="chevron"></span>
          </button>
          <div class="menu-list" role="menu">
            <button role="menuitem" data-all="start-all" data-icon="start">Tout démarrer</button>
            <button role="menuitem" data-all="stop-all" data-icon="stop">Tout arrêter</button>
            <button role="menuitem" data-all="restart-all" data-icon="restart">
              Tout redémarrer
            </button>
          </div>
        </div>
      </div>
    </header>
    <p class="notice" id="notice" hidden></p>
    <div class="middle">
      <section class="list" id="rows" aria-label="Services"></section>
      <aside class="cards" id="cards" aria-label="Weems en chiffres"></aside>
    </div>
    <section class="logs" aria-label="Journaux">
      <div class="logs-head">
        <strong>Journaux</strong>
        <div class="tabs" id="tabs">
          <button data-tab="db">Base</button>
          <button data-tab="api">API</button>
          <button data-tab="site">Site</button>
          <button data-tab="console">Console</button>
        </div>
        <span class="muted" id="logs-count"></span>
      </div>
      <pre id="logs"></pre>
    </section>
    <script src="view.js"></script>
  </body>
</html>
