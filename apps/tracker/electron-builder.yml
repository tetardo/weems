# Desktop tracker installer (J3, closed alpha). Built by .github/workflows/tracker-installer.yml.
appId: app.weems.tracker
productName: Weems Tracker
copyright: Weems
directories:
  app: dist/app # built by scripts/build-app.ts: bundles only, no node_modules
  output: dist/installer
# Everything is bundled into dist/app: without this, electron-builder adds the tracker's node_modules.
files:
  - "**/*"
  - "!node_modules{,/**/*}"
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
linux:
  target: dir # only to check the packaging on Linux (CI, Claude Code); never distributed
mac:
  target: dir # same, on Greg's Mac
# Updates: electron-updater reads the latest published release of this repository (public).
# CI uploads to a draft release tagged tracker-v<version>; publishing it on GitHub (by hand) starts
# the update on the testers' PCs.
publish:
  provider: github
  owner: tetardo
  repo: weems
  tagNamePrefix: tracker-v
  releaseType: draft
