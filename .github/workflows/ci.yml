name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weems
          POSTGRES_PASSWORD: weems
          POSTGRES_DB: weems_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U weems"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://weems:weems@localhost:5432/weems_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Style
        run: pnpm lint
      - name: Structure (boundaries, duplicates, unused code)
        run: pnpm structure
      - name: Tests
        run: pnpm test
      - name: J1 (10 pilotes simulés à ×10, environ 6 min)
        run: pnpm test:j1
      - name: Navigateur des tests J2 et J3
        run: pnpm --filter @weems/e2e exec playwright install --with-deps chromium
      - name: J2 (page d'un vol de 2 h en moins de 2 s, français et anglais)
        run: pnpm test:j2
      - name: J3 (connexion du site et du tracker dans le navigateur)
        run: pnpm test:j3
